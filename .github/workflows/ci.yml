name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS is alpha: it must build and pass tests, but nobody can try it by hand yet.
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # One real dictation in the built app: the macOS voice into likh's mic
      # replay, a fixed transcript, the paste logged (scripts/e2e-dictate.sh).
      - if: runner.os == 'macOS'
        uses: oven-sh/setup-bun@v2
      - if: runner.os == 'macOS'
        name: One dictation, end to end
        run: |
          cargo build -p likh --locked
          say -o speech.wav --data-format=LEI16@16000 "Send the launch notes to the team by Friday."
          scripts/e2e-dictate.sh target/debug/likh speech.wav "Send the launch notes to the team by Friday."
      # The pill on the runner's real screen, listening, failing and gone, to look at.
      - if: runner.os == 'macOS'
        name: The pill on screen
        run: scripts/pill-shots.sh target/debug/likh speech.wav
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: pill-macos
          path: pill-*.png

  # likh.app and its DMG, as a download on every run: ad hoc signed, so
  # macOS asks to confirm it the first time (right-click, Open).
  mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: scripts/build-mac-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: likh-macos
          path: target/macos/likh-macos.dmg

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
