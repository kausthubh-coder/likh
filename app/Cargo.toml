[package]
name = "likh"
version = "0.1.0-alpha.11"
description = "Native dictation that types with your Codex plan."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Software rendering only (tiny-skia). The wgpu renderer idled at 229-313 MB
# against 7 MB for tiny-skia on the same window (docs/plan.md, Measured so far).
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "crisp", "web-colors", "thread-pool", "smol", "canvas"] }
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
arboard = "3"
enigo = "0.6"
hound = "3"
interprocess = "2"
ureq = { version = "3", features = ["json"] }
tiny-skia = "0.11"
ab_glyph = "0.2"
tray-icon = "0.26"
# The Groq key lives in the OS credential store (Windows Credential Manager), never in settings.json.
keyring = { version = "3", features = ["windows-native", "apple-native"] }
# Updates: Ed25519 signature checks (already here through rustls) and release version order.
ring = "0.17"
semver = "1"
earshot = "1.2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
# Action files (`actions/`): one TOML file per action, with line numbers in its errors.
toml = "1"
# History's stats count days on the user's own calendar (a streak breaks at their midnight, not UTC's).
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
iced_test = "0.14"
tempfile = "3"

[lints]
workspace = true

[target."cfg(windows)".build-dependencies]
winresource = "0.1"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Foundation", "Foundation_Collections", "Media_Control"] }
winreg = "0.56"

# macOS (alpha) still uses handy-keys for the shortcut; Windows uses system hotkeys.
[target.'cfg(not(windows))'.dependencies]
handy-keys = "0.3"

# macOS: the app in front (NSWorkspace), for styles, commands' {app} and "scratch that";
# and the pill's panel (pill/macos.rs), fed frames on the main thread through dispatch2.
# All already in the tree through winit, so nothing new is built.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSGeometry"] }
dispatch2 = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSAccessibility",
  "NSCell",
  "NSColor",
  "NSControl",
  "NSGraphics",
  "NSImage",
  "NSImageCell",
  "NSImageView",
  "NSPanel",
  "NSResponder",
  "NSRunningApplication",
  "NSScreen",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }

# Linux isn't a likh platform, but cloud agent sessions run on it: without a
# windowing backend iced's software renderer (softbuffer) doesn't compile, and
# then neither do check, clippy or the tests. Windows and macOS builds are unchanged.
[target.'cfg(target_os = "linux")'.dependencies]
iced = { version = "0.14", default-features = false, features = ["x11"] }
